# Reverse proxy : seul point d'entrée public. Les services Spring ne sont pas exposés.
# /api/identity/v1/x -> identity-service:8081/api/v1/x (idem library, acquisition)
# Journal d'accès sans query string : `$uri` au lieu de `$request`. Le ticket de streaming voyage dans l'URL
# (`/stream/{id}?t=...`, ADR 0001 §5) et ne doit jamais être écrit dans les journaux du conteneur.
log_format homeflix '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 8080;
    access_log /var/log/nginx/access.log homeflix;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;            # ne révèle pas la version de nginx (en-tête Server, pages d'erreur)
    client_max_body_size 1m;      # aucune requête de l'application n'envoie plus d'1 Mo (JSON uniquement)

    # --- En-têtes de sécurité (« always » : aussi sur les erreurs 4xx et 5xx) ---------------------------------
    # CSP stricte : tout vient de la même origine, aucun script ni style en ligne, aucune ressource externe.
    #   script-src / style-src 'self' : seuls les fichiers de l'application (le build n'a pas de code en ligne)
    #   img-src / font-src 'self' data: : « data: » pour les petites ressources intégrées par le build (police)
    #   media-src 'self'              : le lecteur vidéo charge /api/library/v1/stream/... (même origine)
    #   connect-src 'self'            : les appels fetch vers /api/... (même origine : aucun CORS nécessaire)
    #   frame-ancestors 'none'        : la page ne peut être affichée dans aucun cadre (clickjacking)
    #   object-src 'none', base-uri 'self', form-action 'self' : ferme les vecteurs d'injection restants
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; media-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;                              # équivalent de frame-ancestors pour les vieux navigateurs
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    # Pas d'en-tête Access-Control-Allow-* : l'interface et l'API partagent la même origine (CORS inutile).

    # $http_host et non $host : $host perd le port (« localhost » au lieu de « localhost:8080 »). Spring compare l'en-tête
    # Origin que le navigateur ajoute à tout POST, PUT ou DELETE avec Host : sans le port, une requête de la MÊME origine
    # était jugée étrangère et rejetée en 403 « Invalid CORS request » (la connexion aurait échoué).
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    # Jamais exposés : API interservices et endpoints de gestion (ADR 0001 : /internal/** n'est jamais routé).
    # Insensible à la casse, avec ou sans préfixe de version (/api/library/internal, /api/library/v1/actuator…).
    # /actuator/health reste joignable par les conteneurs entre eux (healthchecks), jamais par le proxy.
    location ~* ^/api/[a-z]+/(v[0-9]+/)?(internal|actuator) { return 404; }
    location ~* ^/(internal|actuator)(/|$) { return 404; }

    # Les noms de services sont résolus à chaque requête (résolveur DNS de Docker) :
    # nginx démarre même si un service est arrêté et répond alors 502 au lieu de planter.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/identity/ {
        set $upstream http://identity-service:8081;
        rewrite ^/api/identity/(.*)$ /api/$1 break;
        proxy_pass $upstream;
        # Le service pose le cookie de refresh avec Path=/api/v1/auth ; le navigateur appelle /api/identity/v1/auth/...
        proxy_cookie_path /api/v1/auth /api/identity/v1/auth;
    }
    location /api/library/ {
        set $upstream http://library-service:8082;
        rewrite ^/api/library/(.*)$ /api/$1 break;
        proxy_pass $upstream;
        proxy_buffering off;   # streaming vidéo + requêtes Range
    }
    location /api/acquisition/ {
        set $upstream http://acquisition-service:8083;
        rewrite ^/api/acquisition/(.*)$ /api/$1 break;
        proxy_pass $upstream;
    }

    location / {
        try_files $uri /index.html;
    }
}
