# Reverse proxy : seul point d'entrée public. Les services Spring ne sont pas exposés.
# /api/identity/v1/x -> identity-service:8081/api/v1/x (idem library, acquisition)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    # Jamais exposés : API interservices et endpoints de gestion
    location ~ ^/api/[a-z]+/(internal|actuator) { return 404; }

    location /api/identity/ {
        proxy_pass http://identity-service:8081/api/;
    }
    location /api/library/ {
        proxy_pass http://library-service:8082/api/;
        proxy_buffering off;   # streaming vidéo + requêtes Range
    }
    location /api/acquisition/ {
        proxy_pass http://acquisition-service:8083/api/;
    }

    location / {
        try_files $uri /index.html;
    }
}
