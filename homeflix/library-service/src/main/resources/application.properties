spring.application.name=library-service
server.port=${SERVER_PORT:8082}

# Base de données : variables d'environnement (voir compose.yaml), jamais de valeur en dur.
# Profil "dev" : valeurs par défaut pour une base locale (application-dev.properties).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Seul /actuator/health est exposé (public, sans détail) ; le reste est protégé par Spring Security.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never

# Identity : ensemble de clés publiques (JWKS), variable fournie par compose.yaml.
identity.jwks-uri=${IDENTITY_JWKS_URI}

# Emplacements sous lesquels un dossier de bibliothèque peut être déclaré (montages du conteneur).
library.allowed-bases=${MEDIA_ROOT:/media},${DOWNLOADS_ROOT:/downloads}
identity.issuer=${IDENTITY_ISSUER:homeflix-identity}
# Délai d'attente (connexion et lecture) de la récupération des clés publiques d'Identity.
identity.jwks-timeout=${IDENTITY_JWKS_TIMEOUT:3s}

# Secret de signature des tickets de streaming (STREAM_TICKET_SECRET, voir scripts/gen-secrets.sh).
library.stream.ticket-secret=${STREAM_TICKET_SECRET:}

# Appels internes entre services (ADR 0001) : secret partagé INTERNAL_API_KEY ; vide = tout appel refusé.
homeflix.internal.api-key=${INTERNAL_API_KEY:}
# Dossier de téléchargements (déclaré comme dossier autorisé), partagé avec Acquisition.
library.downloads-root=${DOWNLOADS_ROOT:/downloads}

# Document OpenAPI générée (springdoc) : désactivée par défaut, activée par le test de conformité (voir scripts/check-openapi.sh).
springdoc.api-docs.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=false
