spring.application.name=acquisition-service
server.port=${SERVER_PORT:8083}

# Base de données : variables d'environnement (voir compose.yaml), jamais de valeur en dur.
# Profil "dev" : valeurs par défaut pour une base locale (application-dev.properties).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Seul /actuator/health est exposé (public, sans détail) ; le reste est protégé par Spring Security.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never

# Identity : les jetons RS256 sont validés avec son ensemble de clés publiques (JWKS), sans jamais lire sa base.
# La valeur par défaut est l'adresse interne de compose.yaml ; les clés ne sont chargées qu'à la première validation
# (Acquisition démarre même si Identity est arrêté).
identity.jwks-uri=${IDENTITY_JWKS_URI:http://identity-service:8081/.well-known/jwks.json}
identity.issuer=${IDENTITY_ISSUER:homeflix-identity}
# Délai d'attente (connexion et lecture) de la récupération des clés d'Identity.
identity.jwks-timeout=${IDENTITY_JWKS_TIMEOUT:3s}

# Client BitTorrent (Transmission, RPC sur le réseau interne ; jamais exposé au frontend, voir compose.yaml).
acquisition.transmission.url=${TRANSMISSION_URL:http://transmission:9091/transmission/rpc}
acquisition.transmission.user=${TRANSMISSION_USER:}
acquisition.transmission.password=${TRANSMISSION_PASS:}
acquisition.transmission.timeout=${TRANSMISSION_TIMEOUT:3s}
# Racine partagée avec Library (lecture seule) ; les fichiers terminés arrivent dans /downloads/complete.
acquisition.transmission.downloads-root=${DOWNLOADS_ROOT:/downloads}
acquisition.transmission.download-dir=${TRANSMISSION_DOWNLOAD_DIR:${DOWNLOADS_ROOT:/downloads}/complete}
