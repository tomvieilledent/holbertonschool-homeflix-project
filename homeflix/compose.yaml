name: homeflix

x-service: &service
  restart: unless-stopped
  networks: [internal]
  depends_on:
    db: { condition: service_healthy }

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire (lancez ./scripts/gen-secrets.sh)}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD est obligatoire (lancez ./scripts/gen-secrets.sh)}
      LIBRARY_DB_PASSWORD: ${LIBRARY_DB_PASSWORD:?LIBRARY_DB_PASSWORD est obligatoire (lancez ./scripts/gen-secrets.sh)}
      ACQUISITION_DB_PASSWORD: ${ACQUISITION_DB_PASSWORD:?ACQUISITION_DB_PASSWORD est obligatoire (lancez ./scripts/gen-secrets.sh)}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  identity-service:
    <<: *service
    build: ./identity-service
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://db:5432/identity
      DB_USER: identity
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD est obligatoire (lancez ./scripts/gen-secrets.sh)}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY est obligatoire (lancez ./scripts/gen-secrets.sh)}
      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64:?JWT_PRIVATE_KEY_BASE64 est obligatoire (lancez ./scripts/gen-secrets.sh)}
      SETUP_TOKEN: ${SETUP_TOKEN:?SETUP_TOKEN est obligatoire (lancez ./scripts/gen-secrets.sh)}
    healthcheck: &javahc
      # /actuator/health est public et sans détail (SecurityConfig de chaque service).
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$$SERVER_PORT/actuator/health > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  library-service:
    <<: *service
    build: ./library-service
    depends_on:
      db: { condition: service_healthy }
      identity-service: { condition: service_healthy }
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://db:5432/library
      DB_USER: library
      DB_PASSWORD: ${LIBRARY_DB_PASSWORD:?LIBRARY_DB_PASSWORD est obligatoire (lancez ./scripts/gen-secrets.sh)}
      IDENTITY_JWKS_URI: http://identity-service:8081/.well-known/jwks.json
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY est obligatoire (lancez ./scripts/gen-secrets.sh)}
      STREAM_TICKET_SECRET: ${STREAM_TICKET_SECRET:?STREAM_TICKET_SECRET est obligatoire (lancez ./scripts/gen-secrets.sh)}
      MEDIA_ROOT: /media
      DOWNLOADS_ROOT: /downloads
    volumes:
      - ${MEDIA_DIR:-./demo-media}:/media:ro
      - downloads:/downloads:ro
    healthcheck: *javahc

  acquisition-service:
    <<: *service
    build: ./acquisition-service
    depends_on:
      db: { condition: service_healthy }
      identity-service: { condition: service_healthy }
      transmission: { condition: service_healthy }
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://db:5432/acquisition
      DB_USER: acquisition
      DB_PASSWORD: ${ACQUISITION_DB_PASSWORD:?ACQUISITION_DB_PASSWORD est obligatoire (lancez ./scripts/gen-secrets.sh)}
      IDENTITY_JWKS_URI: http://identity-service:8081/.well-known/jwks.json
      LIBRARY_BASE_URL: http://library-service:8082
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY est obligatoire (lancez ./scripts/gen-secrets.sh)}
      TRANSMISSION_URL: http://transmission:9091/transmission/rpc
      TRANSMISSION_USER: ${TRANSMISSION_USER:?TRANSMISSION_USER est obligatoire (lancez ./scripts/gen-secrets.sh)}
      TRANSMISSION_PASS: ${TRANSMISSION_PASS:?TRANSMISSION_PASS est obligatoire (lancez ./scripts/gen-secrets.sh)}
      DOWNLOADS_ROOT: /downloads
    volumes:
      - downloads:/downloads
    healthcheck: *javahc

  # Client BitTorrent existant : aucune interface publiée, joignable uniquement par acquisition-service.
  transmission:
    image: lscr.io/linuxserver/transmission:latest # à épingler sur une version testée
    restart: unless-stopped
    networks: [internal]
    environment:
      PUID: 1000
      PGID: 1000
      USER: ${TRANSMISSION_USER:?TRANSMISSION_USER est obligatoire (lancez ./scripts/gen-secrets.sh)}
      PASS: ${TRANSMISSION_PASS:?TRANSMISSION_PASS est obligatoire (lancez ./scripts/gen-secrets.sh)}
    volumes:
      - transmission-config:/config
      - downloads:/downloads
    healthcheck:
      # Le RPC répond 401 sans identifiants : le service est joignable.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:9091/transmission/rpc"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [internal]
    depends_on:
      identity-service: { condition: service_healthy }
      library-service: { condition: service_healthy }
      acquisition-service: { condition: service_healthy }
    ports:
      - "${FRONTEND_PORT:-8080}:8080"

networks:
  internal:

volumes:
  pgdata:
  downloads:
  transmission-config:
