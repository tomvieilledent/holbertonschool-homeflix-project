# Intégration continue HomeFlix : build et tests des 3 services Java, frontend, scan de secrets,
# validation des contrats OpenAPI et de la configuration Compose, build des images Docker (sans push).
# Déclenchée sur chaque pull request et sur chaque push vers main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Droits minimaux : la CI ne lit que le dépôt.
permissions:
  contents: read

# Une seule exécution par branche : une nouvelle poussée annule l'exécution précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [identity-service, library-service, acquisition-service]
    defaults:
      run:
        working-directory: homeflix/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: homeflix/${{ matrix.service }}/pom.xml
      # Les tests d'intégration utilisent Testcontainers : Docker est disponible sur le runner.
      - name: Compiler et tester
        run: ./mvnw -B verify
      - name: Publier les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests-${{ matrix.service }}
          path: homeflix/${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: homeflix/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: homeflix/frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      # Sans « --if-present » : si le script « test » disparaît par erreur, la CI doit échouer.
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      # Garde-fou : aucun mock (MSW, jeton ou mot de passe factices) ne doit se trouver dans le build de production.
      - name: Aucun mock dans le build
        run: npm run check:no-mocks

  secrets:
    name: Scan de secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tout l'historique : un secret supprimé après coup reste dans les anciens commits
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.24.3 detect \
            --source /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose
      - name: Contrôle des fichiers sensibles (check-secrets.sh)
        if: hashFiles('homeflix/scripts/check-secrets.sh') != ''
        run: ./homeflix/scripts/check-secrets.sh

  contracts:
    name: Contrats OpenAPI et fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Seules les erreurs font échouer le lint ; les avertissements sont affichés (voir redocly.yaml).
      - name: Lint des contrats OpenAPI
        run: npx --yes @redocly/cli@1.34.5 lint docs/api/*.openapi.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fixtures valides contre les contrats
        if: hashFiles('docs/api/fixtures/validate.py') != ''
        run: |
          pip install --quiet pyyaml jsonschema
          python docs/api/fixtures/validate.py

  compose:
    name: Configuration Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # .env.example ne contient que des valeurs fictives : suffisant pour valider la structure.
      - name: Valider compose.yaml
        working-directory: homeflix
        run: |
          cp .env.example .env
          docker compose config --quiet
          if [ -f compose.dev.yaml ]; then docker compose -f compose.yaml -f compose.dev.yaml config --quiet; fi

  images:
    name: Image Docker (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [identity-service, library-service, acquisition-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Construction seule : aucune image n'est publiée (push: false).
      - uses: docker/build-push-action@v6
        with:
          context: homeflix/${{ matrix.image }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  smoke:
    name: Test de fumée (pile complète)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # Actif dès que le script existe sur la branche (issue #18) ; sinon l'étape est ignorée.
      # KEEP_UP=1 : la pile reste démarrée pour l'étape suivante (elle est arrêtée à la fin).
      - name: Démarrer la pile et vérifier
        if: hashFiles('homeflix/scripts/smoke.sh') != ''
        run: KEEP_UP=1 ./homeflix/scripts/smoke.sh
      # En-têtes de sécurité, CSP, absence de CORS, routes internes bloquées et limite de taille du reverse proxy (#54).
      - name: En-têtes de sécurité et blocages du proxy
        if: hashFiles('homeflix/scripts/check-security-headers.sh') != ''
        run: ./homeflix/scripts/check-security-headers.sh
      - name: Arrêter la pile
        if: always() && hashFiles('homeflix/scripts/smoke.sh') != ''
        working-directory: homeflix
        run: docker compose down -v || true
      # Scénario « redémarrer les conteneurs » (#89) : données créées par l'API, puis `restart` et `down`/`up`, relues et
      # comparées. Projet Docker isolé (homeflix-persisttest) : il démarre après l'arrêt de la pile du test de fumée.
      - name: Persistance des données au redémarrage
        if: hashFiles('homeflix/scripts/test-persistence.sh') != ''
        run: ./homeflix/scripts/test-persistence.sh
